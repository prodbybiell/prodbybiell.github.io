<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- TITLE AND DESCRIPTION FOR GOOGLE -->
    <title>Poppy Playtime Web - prodbybiell</title>
    <meta name="description" content="Play Poppy Playtime Web online directly in your browser. Hosted by prodbybiell.">
    <meta name="keywords" content="Poppy Playtime Web, prodbybiell, online game, Unity WebGL, browser game">
    <meta name="author" content="prodbybiell">

    <!-- GOOGLE SEARCH CONSOLE VERIFICATION -->
    <meta name="google-site-verification" content="IIm5fBGZdaoELXYrLEkiVcVO0ly1_6iH3iRJQ-upcfE" />

    <link rel="icon" href="data:,">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-container {
        width: 100vw;
        height: 56.25vw;
        max-height: 100vh;
        max-width: 177.78vh;
        position: relative;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #unity-loading-bar {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
      }
      #unity-progress-bar-empty {
        width: 200px;
        height: 18px;
        background: #333;
        border-radius: 4px;
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px; color: white; position: absolute; top: 0; width: 100%;';
        else {
          setTimeout(function() { warningBanner.removeChild(div); }, 5000);
        }
      }

      async function fetchAndDecompress(url, mimeType, ext) {
        const response = await fetch(url);
        const ds = new DecompressionStream("gzip");
        const decompressedStream = response.body.pipeThrough(ds);
        const blob = await new Response(decompressedStream).blob();
        return URL.createObjectURL(new Blob([blob], { type: mimeType })) + ext;
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/PoppyplaytimeWeb.loader.js";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = async () => {
        try {
          const [dataUrl, frameworkUrl, codeUrl] = await Promise.all([
            fetchAndDecompress(buildUrl + "/PoppyplaytimeWeb.data.gz", "application/octet-stream", ""),
            fetchAndDecompress(buildUrl + "/PoppyplaytimeWeb.framework.js.gz", "application/javascript", "#ext=.js"),
            fetchAndDecompress(buildUrl + "/PoppyplaytimeWeb.wasm.gz", "application/wasm", "#ext=.wasm")
          ]);

          var config = {
            arguments: [],
            dataUrl: dataUrl,
            frameworkUrl: frameworkUrl,
            codeUrl: codeUrl,
            streamingAssetsUrl: "StreamingAssets",
            companyName: "TheDevDude",
            productName: "ppUnityProjectBUILD",
            productVersion: "1.5",
            showBanner: unityShowBanner
          };

          createUnityInstance(canvas, config, (progress) => {
            document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            document.querySelector("#unity-loading-bar").style.display = "none";
          }).catch((message) => {
            alert(message);
          });
        } catch (err) {
          alert("Error loading game: " + err);
        }
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
